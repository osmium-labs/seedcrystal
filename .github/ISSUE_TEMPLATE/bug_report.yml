name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or `git rev-parse --short HEAD` if you built from source.
    validations:
      required: true
  - type: input
    id: preset
    attributes:
      label: Preset
      description: The built-in preset id, or "custom" for your own preset file.
      placeholder: osmium-mainnet
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Publish mode
      options:
        - authoritative
        - cloudflare
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `seedcrystal doctor`
      description: Remove tokens first.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: With `RUST_LOG=debug` if you can reproduce it. Remove tokens first.
      render: text
