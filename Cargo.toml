[package]
name = "seedcrystal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Multi-coin DNS seeder for Bitcoin-protocol UTXO chains"
repository = "https://github.com/osmium-labs/seedcrystal"
readme = "README.md"
keywords = ["dns", "seeder", "bitcoin", "p2p", "cryptocurrency"]
categories = ["network-programming", "command-line-utilities", "cryptography::cryptocurrencies"]

[lib]
name = "seedcrystal"
path = "src/lib.rs"

[[bin]]
name = "seedcrystal"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
hickory-proto = "=0.26.3"
rand = "=0.10.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
groestl = "=0.11.0"
socket2 = { version = "=0.6.5", features = ["all"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["io-util", "net", "macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = "=0.7.20"
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum = "=0.8.9"
tempfile = "=3.27.0"
