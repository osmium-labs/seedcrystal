# Every value is cited from litecoin-project/litecoin@v0.21.5.8
# (ec1b6489a900d09cf5991e220dce089c77a232a2).

id = "litecoin-mainnet"
magic = "fbc0b6db"            # src/chainparams.cpp:120-123
default_port = 9333           # src/chainparams.cpp:124
protocol_version = 70017      # src/version.h:12 (PROTOCOL_VERSION)
min_peer_version = 31800      # src/version.h:18 (MIN_PEER_PROTO_VERSION), src/net_processing.cpp:2707
version_trailer = "none"
block_interval_secs = 150     # src/chainparams.cpp:87 (nPowTargetSpacing = 2.5 * 60)
# src/net_processing.cpp:2755-2761: sendaddrv2 is sent between version and verack to peers at
# 70016 or later; :2946-2951: one received after verack disconnects.
addrv2_min_version = 70016
addrv2_placement = "before_verack"
# The DNS name is x%x.<seed> from GetDesirableServiceFlags(NODE_NONE) (src/net.cpp:1814-1815),
# which returns NODE_NETWORK | NODE_WITNESS | NODE_MWEB (src/protocol.cpp:147-152), and those are
# 1 | 1 << 3 | 1 << 24 (src/protocol.h:301, 312, 324), so nodes query x1000009.
seed_flags = 0x1000009
filters = [0x1, 0x5, 0x9, 0xd, 0x1000009, 0x100000d]
# src/chainparams.cpp:139-143
bootstrap_dns = ["seed-a.litecoin.loshan.co.uk", "dnsseed.thrasher.io", "dnsseed.litecointools.com", "dnsseed.ltcpool.org", "dnsseed.koin-project.com"]
bootstrap_fixed = []
