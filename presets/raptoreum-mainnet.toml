# Every value is cited from Raptor3um/raptoreum@2.0.3.01-mainnet
# (900794ea94ff11023667765173295b459d32732c).

id = "raptoreum-mainnet"
magic = "72746d2e"            # src/chainparams.cpp:239-242
default_port = 10226          # src/chainparams.cpp:243
protocol_version = 70220      # src/version.h:14 (PROTOCOL_VERSION)
# src/version.h:22 (MIN_PEER_PROTO_VERSION). The floor is MIN_PEER_PROTO_VERSION once
# IsFutureActive, else OLD_MIN_PEER_PROTO_VERSION (src/net_processing.cpp:2413, src/version.h:20).
# nFutureForkBlock = 420420 (src/chainparams.cpp:206): nodes whose tip is past it require
# MIN_PEER_PROTO_VERSION.
min_peer_version = 70219
# src/net_processing.cpp:2429-2445: the fields after relay, the smartnode challenge and flag, are
# read only under if (!vRecv.empty()), so a version message without them is accepted.
version_trailer = "none"
block_interval_secs = 120     # src/chainparams.cpp:198 (nPowTargetSpacing)
# No addrv2_min_version: there is no sendaddrv2 anywhere under src/ (git grep -i).
# The DNS name is x%x.<seed> from GetDesirableServiceFlags(NODE_NONE) (src/net.cpp:1939-1940), which
# returns NODE_NETWORK (src/protocol.cpp:208-212), and NODE_NETWORK = 1 (src/protocol.h:290), so
# nodes query x1.
seed_flags = 0x1
filters = [0x1, 0x5]
bootstrap_dns = ["lbdn.raptoreum.com"]   # src/chainparams.cpp:256
# src/chainparams.cpp:257: the IP entry in vSeeds, on default_port.
bootstrap_fixed = ["51.89.21.112:10226"]
